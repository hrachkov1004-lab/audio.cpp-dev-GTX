name: Windows CUDA 12.4 Build

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    name: Build GTX 1080 (CUDA 12.4 / SM 61)
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CUDA 12.4
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.4.1'
          method: 'local'

      - name: Configure CMake
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=61 ^
            -DENGINE_ENABLE_OPENMP=OFF ^
            -DGGML_OPENMP=OFF ^
            -DENGINE_ENABLE_CUDA_GRAPHS=OFF ^
            -DENGINE_BUILD_TESTS=OFF ^
            -DAUDIOCPP_BUILD_NATIVE_MODEL_MANAGER=ON ^
            -DCMAKE_BUILD_TYPE=Release ..

      - name: Build Targets
        shell: cmd
        run: |
          cd build
          cmake --build . --config Release --target audiocpp_cli -- /m:4
          cmake --build . --config Release --target audiocpp_server -- /m:4

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audiocpp-windows-cuda12.4-gtx1080
          path: |
            build/bin/Release/*
