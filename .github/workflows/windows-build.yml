name: Windows CUDA 12.4 Build

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    name: Build GTX 1080 (CUDA 12.4 / SM 61)
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CUDA 12.4
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.4.1'
          method: 'local'

      # Combined step: Initialize MSVC Environment AND run CMake Configure
      - name: Configure CMake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DENGINE_ENABLE_CUDA=ON ^
            -DENGINE_ENABLE_OPENMP=OFF ^
            -DGGML_OPENMP=OFF ^
            -DENGINE_ENABLE_CUDA_GRAPHS=OFF ^
            -DENGINE_ENABLE_VULKAN=OFF ^
            -DENGINE_ENABLE_METAL=OFF ^
            -DENGINE_ENABLE_LLAMAFILE=ON ^
            -DENGINE_ENABLE_NATIVE_CPU=ON ^
            -DENGINE_BUILD_TESTS=OFF ^
            -DENGINE_ENABLE_CPU_ALL_VARIANTS=ON ^
            "-DCMAKE_CUDA_ARCHITECTURES=61" ^
            -DAUDIOCPP_DEPLOYMENT_BUILD=ON ^
            -DAUDIOCPP_BUILD_NATIVE_MODEL_MANAGER=ON ^
            -DCUDAToolkit_ROOT="%CUDA_PATH%"

      # Combined step: Initialize MSVC Environment AND run the compilation build
      - name: Build Targets
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --build build --config Release -j %NUMBER_OF_PROCESSORS% --target audiocpp_cli audiocpp_server audiocpp_gguf

      - name: Bundle VC runtime
        shell: pwsh
        working-directory: build/bin
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Sort-Object { try { [version]$_.Name } catch { [version]'0.0' } } -Descending |
            Select-Object -First 1
          $dir = Join-Path $redist.FullName 'x64\Microsoft.VC143.CRT'
          if (Test-Path $dir) {
            Get-ChildItem "$dir\*.dll" | Where-Object {
              $_.Name -match '^(vcruntime140|msvcp140)'
            } | Copy-Item -Destination . -ErrorAction SilentlyContinue
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audiocpp-windows-cuda12.4-gtx1080
          path: |
            build/bin/*
